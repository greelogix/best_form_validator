name: best_form_validator
description: best_form_validator is a comprehensive Flutter package designed to simplify form validation. It provides a robust set of validation functions for various form fields, including email, phone, password, name, and age. The package supports phone number validation according to different countries' phone number formats, making it versatile for international applications.
version: 1.0.3
repository: https://github.com/greelogix/best_form_validator

environment:
  sdk: ^3.4.3

# Add regular dependencies here.
dependencies:
  flutter:
    sdk: flutter
  intl: ^0.19.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
  mockito: ^5.1.0


flutter:
  assets:
    - assets/countries_phone_regex.json

  uses-material-design: true
  # Correctly formatted authors section
