name: best_form_validator
description: High-performance form validation package for Dart & Flutter. Zero-initialization validators for Forms, Email, Phone (50+ countries), Password Strength, Bank/Credit Cards, Name, & Age.
version: 1.2.0
homepage: https://github.com/greelogix/best_form_validator
repository: https://github.com/greelogix/best_form_validator
issue_tracker: https://github.com/greelogix/best_form_validator/issues

topics:
  - form
  - validator
  - email
  - phone
  - password

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0


flutter:

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:
