name: best_form_validator
description: A comprehensive Flutter form validation package. Supports email, phone (50+ countries), password, name, age, and more with full localization.
version: 1.1.2
homepage: https://github.com/greelogix/best_form_validator
repository: https://github.com/greelogix/best_form_validator
issue_tracker: https://github.com/greelogix/best_form_validator/issues

topics:
  - form
  - validator
  - email
  - phone
  - password

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0


flutter:
  assets:
    - assets/countries_phone_regex.json

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:
