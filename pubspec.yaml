name: best_form_validator
description: >-
  Zero-initialization Flutter form validation: email, url, phone (52 countries,
  local & international formats), password strength, Unicode names, age,
  date, strict time, credit card (Luhn), IBAN (MOD-97), MultiValidator
  chaining, and 25-language localization.
version: 1.4.1
homepage: https://github.com/greelogix/best_form_validator
repository: https://github.com/greelogix/best_form_validator
issue_tracker: https://github.com/greelogix/best_form_validator/issues

topics:
  - form
  - validator
  - url
  - phone
  - password

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=5.0.0 <7.0.0"

flutter:

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:
